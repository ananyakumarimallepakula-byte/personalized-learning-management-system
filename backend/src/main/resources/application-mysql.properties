# ===================================================================
# MySQL Profile Configuration
# Activate via: mvn spring-boot:run -Dspring-boot.run.profiles=mysql
# ===================================================================

spring.datasource.url=jdbc:mysql://localhost:3306/personalized_learning_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=root
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

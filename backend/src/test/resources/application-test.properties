# ===================================================================
# Test Profile Configuration (In-Memory H2 for automated tests)
# ===================================================================
spring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;MODE=MySQL;DATABASE_TO_LOWER=TRUE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect

app.thresholds.weak=60.0
app.thresholds.strong=75.0
app.prediction.weights.historical-risk=40.0
app.prediction.weights.recent-risk=25.0
app.prediction.weights.wrong-answer-rate=15.0
app.prediction.weights.trend-risk=10.0
app.prediction.weights.inactivity-risk=10.0
